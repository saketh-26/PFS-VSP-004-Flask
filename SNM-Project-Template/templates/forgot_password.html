{% extends "base.html" %}
{% block title %}
Forgot Password - SNS
{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Forgot Password</h1>
    <form
        method="POST"
        action="{{ url_for('forgot_password') }}"
    >
        <div class="form-group">
            <label for="email">
                Email
            </label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>
        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Send Link
        </button>
    </form>
</div>

{% endblock %}
