{% extends "base.html" %}

{% block title %}Verify Email | ShopZone{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <div class="auth-logo">
                    <i class="bi bi-envelope" aria-hidden="true"></i>
                </div>
                <h2 class="auth-title">Verify Your Email</h2>
                <p class="auth-subtitle">
                    Enter the six-digit code sent to {{ email }}.
                    It expires in 10 minutes.
                </p>
            </div>

            <form method="POST" action="{{ url_for('verify') }}">
                <div class="mb-4">
                    <label for="otp" class="form-label">Verification Code</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock" aria-hidden="true"></i>
                        </span>
                        <input type="text" id="otp" name="otp"
                               class="form-control" placeholder="Enter your code"
                               inputmode="numeric" autocomplete="one-time-code"
                               pattern="[0-9]{6}" maxlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn auth-btn text-white w-100">
                    Verify Email
                </button>
            </form>

            <form method="POST" action="{{ url_for('resend_verification') }}"
                  class="text-center mt-4">
                <span class="text-muted">Didn't receive a code?</span>
                <button type="submit"
                        class="btn btn-link fw-semibold text-primary text-decoration-none p-0">
                    Resend code
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
