{% extends "base.html" %}

{% block title %}Products | ShopZone{% endblock %}

{% block content %}
<section class="py-5 bg-white">
    <div class="container">
        <h1 class="fw-bold mb-4">Products</h1>

        <div class="row g-4">
            {% for number in range(1, 5) %}
                <div class="col-6 col-lg-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="bg-light text-center py-5">
                            <i class="bi bi-box-seam text-secondary"
                               style="font-size: 80px;"
                               aria-hidden="true"></i>
                        </div>

                        <div class="card-body">
                            <h2 class="h5 card-title">Premium Product {{ number }}</h2>
                            <p class="fw-bold mb-0">₹999</p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
